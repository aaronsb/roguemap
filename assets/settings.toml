[[setting]]
key = "traversal"
description = "Whether a walk key moves the figure that way on screen or along the map axes."
label = "Traversal"
values = ["screen space", "map axes"]
default = 0

[[setting]]
key = "mouse"
description = "What the mouse does with the view (ADR-008): drag turns it while a button is held, free turns it on any pointer motion (a terminal has no pointer lock, so the turn stops at the screen edge and you lift the mouse as you would at the edge of a mousepad), off ignores it. The wheel zooms the table and narrows or widens a perspective one either way."
label = "Mouse"
values = ["drag", "free", "off"]
default = 0

[[setting]]
key = "camera"
description = "Where the eye sits (ADR-009): the table is the orthographic view at its angle above the ground; chase, shoulder and first-person are perspective views placed from the character; free is a detached eye the walk keys fly, which V enters and leaves."
label = "Camera"
values = ["table", "chase", "shoulder", "first-person", "free"]
default = 0

[[setting]]
key = "projection"
description = "How the vantage's scale and distance become a picture (ADR-010): vantage is the one it has always had, orthographic for the table and perspective for the rest; orthographic drops the distance and keeps the scale, so a chase or shoulder view becomes the table's look locked to the character; perspective puts an eye at the distance the scale implies, so the overview gains a vanishing point. It says nothing to first-person or free, whose eye is their own anchor."
label = "Projection"
values = ["vantage", "orthographic", "perspective"]
default = 0

[[setting]]
key = "coupling"
description = "Whether the body turns with the view (ADR-009): under body-turns a walk key is a screen direction read against the view every tick, so the mouse steers the walk and a and d strafe; under view-only w and s pace the body along its own facing, a and d turn it, and the mouse turns the view alone."
label = "Coupling"
values = ["body-turns", "view-only"]
default = 0

[[setting]]
key = "fov"
description = "The field of view of a perspective camera across the screen, in degrees; preset is the mode's own (60 for chase and first-person, 40 for shoulder). The table has none. < and > narrow and widen it while playing."
label = "Field of view"
values = ["preset", "30", "40", "50", "60", "70", "80", "90", "100", "110"]
default = 0

[[setting]]
key = "fog"
description = "Where the far field fades to the sky colour by its depth from the eye (#21): in the perspective views, in the table too (by depth past the screen centre), or nowhere. The distance is the weather's visibility."
label = "Fog"
values = ["perspective", "always", "never"]
default = 0

[[setting]]
key = "view"
description = "A bounded island floating in the sky, or terrain in every direction."
label = "World view"
values = ["island", "filled"]
default = 0
shortcut = "v"

[[setting]]
key = "glyphs"
description = "Which glyph set draws the scene."
label = "Glyphs"
values = ["petscii", "ascii"]
default = 0
shortcut = "g"

[[setting]]
key = "hud"
description = "The status bar and help line."
label = "HUD"
values = ["shown", "hidden"]
default = 0
shortcut = "H"

[[setting]]
key = "inset"
description = "The second view of ADR-004, following the player at the other end of the zoom scale: which corner it sits in, or off. It needs a hundred columns to show at all."
label = "Inset"
values = ["off", "bottom-right", "bottom-left", "top-right", "top-left"]
default = 1

[[setting]]
key = "clock"
description = "Whether the day clock runs."
label = "Clock"
values = ["running", "paused"]
default = 0
shortcut = "p"

[[setting]]
key = "weather"
description = "Automatic weather, or a fixed preset."
label = "Weather"
values = ["auto", "clear", "cloudy", "rain", "storm"]
default = 0
shortcut = "W"

[[setting]]
key = "wind"
description = "Automatic wind, or a fixed strength."
label = "Wind"
values = ["auto", "calm", "breeze", "windy", "gale"]
default = 0

[[setting]]
key = "day_length"
description = "How long a day takes in real time."
label = "Day length"
values = ["2 min", "10 min", "1 hour", "24 hours"]
default = 1

[[setting]]
key = "clouds"
description = "The cloud layer seen from above at the smallest zooms."
label = "Cloud layer"
values = ["shown", "hidden"]
default = 0

[[setting]]
key = "antialias"
description = "Sextant supersampling along surface boundaries; PETSCII glyphs only."
label = "Antialias"
values = ["on", "off"]
default = 0
