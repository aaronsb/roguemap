[[setting]]
key = "traversal"
description = "Whether a walk key moves the figure that way on screen or along the map axes."
label = "Traversal"
values = ["screen space", "map axes"]
default = 0

[[setting]]
key = "camera"
description = "How the world maps to the screen (ADR-007): the isometric mode is the orthographic view at the pitch the four footprints imply; chase, shoulder and first-person are perspective views from an eye placed from the character."
label = "Camera"
values = ["isometric", "chase", "shoulder", "first-person"]
default = 0

[[setting]]
key = "fov"
description = "The field of view of a perspective camera across the screen, in degrees; preset is the mode's own (60 for chase and first-person, 40 for shoulder). The isometric mode has none. < and > narrow and widen it while playing."
label = "Field of view"
values = ["preset", "30", "40", "50", "60", "70", "80", "90", "100", "110"]
default = 0

[[setting]]
key = "fog"
description = "Where the far field fades to the sky colour by its depth from the eye (#21): in the perspective views, in the isometric view too (by depth past the screen centre), or nowhere. The distance is the weather's visibility."
label = "Fog"
values = ["perspective", "always", "never"]
default = 0

[[setting]]
key = "view"
description = "A bounded island floating in the sky, or terrain in every direction."
label = "World view"
values = ["island", "filled"]
default = 0
shortcut = "v"

[[setting]]
key = "glyphs"
description = "Which glyph set draws the scene."
label = "Glyphs"
values = ["petscii", "ascii"]
default = 0
shortcut = "g"

[[setting]]
key = "hud"
description = "The status bar and help line."
label = "HUD"
values = ["shown", "hidden"]
default = 0
shortcut = "H"

[[setting]]
key = "inset"
description = "The second view of ADR-004, following the player at the other end of the zoom scale: which corner it sits in, or off. It needs a hundred columns to show at all."
label = "Inset"
values = ["off", "bottom-right", "bottom-left", "top-right", "top-left"]
default = 1

[[setting]]
key = "clock"
description = "Whether the day clock runs."
label = "Clock"
values = ["running", "paused"]
default = 0
shortcut = "p"

[[setting]]
key = "weather"
description = "Automatic weather, or a fixed preset."
label = "Weather"
values = ["auto", "clear", "cloudy", "rain", "storm"]
default = 0
shortcut = "W"

[[setting]]
key = "wind"
description = "Automatic wind, or a fixed strength."
label = "Wind"
values = ["auto", "calm", "breeze", "windy", "gale"]
default = 0

[[setting]]
key = "day_length"
description = "How long a day takes in real time."
label = "Day length"
values = ["2 min", "10 min", "1 hour", "24 hours"]
default = 1

[[setting]]
key = "clouds"
description = "The cloud layer seen from above at the smallest zooms."
label = "Cloud layer"
values = ["shown", "hidden"]
default = 0

[[setting]]
key = "antialias"
description = "Sextant supersampling along surface boundaries; PETSCII glyphs only."
label = "Antialias"
values = ["on", "off"]
default = 0
